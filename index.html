<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="logo">MySite</div>
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>
    <section id="home" class="hero">
        <h1>Welcome to My Website</h1>
        <p>A simple, clean website built with HTML & CSS.</p>
        <a href="#about" class="btn">Learn More</a>
    </section>
    <section id="about" class="about">
        <h2>About</h2>
        <p>This is a minimal website template created as a demonstration. It features a responsive design, a navigation bar, and multiple sections.</p>
    </section>
    <section id="contact" class="contact">
        <h2>Contact</h2>
        <form>
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email" required>
            <textarea placeholder="Your Message" rows="5" required></textarea>
            <button type="submit">Send</button>
        </form>
    </section>
    <footer>
        <p>&copy; 2026 Simple Website</p>
    </footer>
</body>
</html>
